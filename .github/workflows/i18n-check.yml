name: i18n key parity

on:
  pull_request:
    paths:
      - 'i18n/locales/**'
      - 'scripts/check-i18n-keys.mjs'
      - '.github/workflows/i18n-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-i18n-keys.mjs
